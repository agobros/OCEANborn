[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanborn"
version = "0.7"
description = "Consistent, publication-ready Matplotlib styling and figure saving."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sandro Agostini", email = "sandro.agostini@ibm.com" }
]
dependencies = [
  "matplotlib",
  "cycler"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanborn"
version = "0.5"
description = "This package contains the relevant classes to plot unified and consistent within the OCEAN Squids group at IBM Research Zurich."
authors = [
  { name = "Sandro Agostini", email = "sandro.agostini@ibm.com" }
]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "seaborn"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*"]



